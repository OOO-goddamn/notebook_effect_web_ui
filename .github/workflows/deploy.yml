name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: 'npm'

            - name: Build site
              run: |
                  npm install
                  npm run build:gh-pages

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GH_ACTION_TOKEN }}
                  publish_dir: ./dist
